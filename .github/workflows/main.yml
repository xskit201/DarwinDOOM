name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build watchOS App & IPA
        run: |
          xcodebuild archive \
            -project DarwinDOOM.xcodeproj \
            -scheme "DarwinDOOMWatch Watch App" \
            -destination "generic/platform=watchOS" \
            -archivePath build/DarwinDOOM.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p Payload
          cp -r build/DarwinDOOM.xcarchive/Products/Applications/*.app Payload/ 2>/dev/null || true
          
          # הסרת המפתח שמכשיל את Sideloadly
          plutil -remove ITSWatchOnlyContainer Payload/*.app/Info.plist 2>/dev/null || true

          zip -r DarwinDOOM.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DarwinDOOM-IPA
          path: DarwinDOOM.ipa
