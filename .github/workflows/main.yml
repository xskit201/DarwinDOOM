name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild archive \
            -project DarwinDOOM.xcodeproj \
            -scheme "DarwinDOOMWatch Watch App" \
            -destination "generic/platform=watchOS" \
            -archivePath build/DarwinDOOM.xcarchive \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p Payload
          cp -r build/DarwinDOOM.xcarchive/Products/Applications/*.app Payload/
          
          # מחיקת ההגבלה של WatchOnly כדי ש-Sideloadly תסכים להתקין
          plutil -remove WKWatchOnly Payload/*.app/Info.plist 2>/dev/null || true
          plutil -remove WKRunsIndependentlyOfCompanionApp Payload/*.app/Info.plist 2>/dev/null || true

          zip -r DarwinDOOM.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DarwinDOOM-IPA
          path: DarwinDOOM.ipa
