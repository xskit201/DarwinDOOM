name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build watchOS App & IPA
        run: |
          xcodebuild archive \
            -project DarwinDOOM.xcodeproj \
            -scheme "DarwinDOOMWatch Watch App" \
            -sdk watchos \
            -archivePath build/DarwinDOOM.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          
          mkdir -p Payload
          cp -r build/DarwinDOOM.xcarchive/Products/Applications/*.app Payload/ 2>/dev/null || true
          zip -r DarwinDOOM.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DarwinDOOM-IPA
          path: DarwinDOOM.ipa
